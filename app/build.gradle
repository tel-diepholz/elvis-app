plugins {
    id 'com.android.application'
}

// Version aus dem Git-Tag (v1.2.3) bzw. der Build-Nummer von GitHub Actions; lokal 0.0.0-dev
def tag = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
def versionFromTag = tag?.startsWith('v') ? tag.substring(1) : '0.0.0-dev'
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// Vorgabe für das Cloud-Relay (tel-diepholz/elvis-relay); in der App unter „Relay-Adresse“ änderbar.
// Für ein eigenes Relay beim Bauen ELVIS_APP_RELAY_URL setzen (Repository-Variable).
def relayUrl = System.getenv('ELVIS_APP_RELAY_URL') ?: 'https://elvis-app.h2com.eu'

// Signierschlüssel aus Umgebungsvariablen (GitHub-Secrets, siehe README). Ohne Schlüssel wird mit dem
// Debug-Schlüssel signiert – solche Builds lassen sich nicht über eine Version mit echtem Schlüssel aktualisieren.
def keystoreFile = System.getenv('ELVIS_APP_KEYSTORE_FILE')
def hasReleaseKey = keystoreFile && file(keystoreFile).exists()

android {
    namespace 'de.teldiepholz.elvisapp'
    compileSdk 35

    defaultConfig {
        applicationId 'de.teldiepholz.elvisapp'
        // Ab Android 8: Benachrichtigungskanäle und startForegroundService
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName versionFromTag
        buildConfigField 'String', 'RELAY_URL', "\"${relayUrl}\""
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ELVIS_APP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ELVIS_APP_KEY_ALIAS')
                keyPassword System.getenv('ELVIS_APP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Fester Dateiname, damit .../releases/latest/download/elvis-app.apk immer auf die neueste Version zeigt
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = 'elvis-app.apk'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
