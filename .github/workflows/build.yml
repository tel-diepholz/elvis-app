name: App bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vorgabe für die Relay-Adresse in der App (Repository-Variable, siehe README)
      ELVIS_APP_RELAY_URL: ${{ vars.ELVIS_APP_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Signierschlüssel aus den Repository-Secrets (siehe README); ohne Secrets wird mit Debug-Schlüssel signiert
      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ELVIS_APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ELVIS_APP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signierschlüssel hinterlegt – App wird mit Debug-Schlüssel signiert"
          fi

      - name: Testen, APK und App Bundle bauen
        env:
          ELVIS_APP_KEYSTORE_PASSWORD: ${{ secrets.ELVIS_APP_KEYSTORE_PASSWORD }}
          ELVIS_APP_KEY_ALIAS: ${{ secrets.ELVIS_APP_KEY_ALIAS }}
          ELVIS_APP_KEY_PASSWORD: ${{ secrets.ELVIS_APP_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: elvis-app
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
